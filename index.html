<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O Farol das Nove Luzes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --mar:#0F5C7A; --mar2:#1C8CA8; --espuma:#FBFDF6; --basalto:#25303B;
  --sol:#FFC83D; --sol2:#E09A00; --hort:#6D7FE0; --hort2:#4856B0;
  --pasto:#58B368; --pasto2:#3A8A4B; --rosa:#EF6FA8; --areia:#F4E4B4;
  --erro:#D8483F;
}
*{box-sizing:border-box}
html{font-size:20px}
body{margin:0;font-family:"Andika","Trebuchet MS",Verdana,sans-serif;color:var(--basalto);
  background:var(--mar);min-height:100vh;line-height:1.5;
  background-image:radial-gradient(ellipse 60px 14px at 30px 20px,rgba(255,255,255,.07) 98%,transparent),
                   radial-gradient(ellipse 60px 14px at 90px 60px,rgba(255,255,255,.05) 98%,transparent);
  background-size:120px 80px}
h1,h2,h3,.tit{font-family:"Baloo 2","Trebuchet MS",sans-serif;font-weight:800;line-height:1.1;margin:0}
h1{font-size:2.4rem} h2{font-size:1.7rem} h3{font-size:1.25rem}
p{margin:.4rem 0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--rosa);outline-offset:3px}
#app{max-width:1040px;margin:0 auto;padding:.6rem .7rem 3rem}

/* botões tipo brinquedo */
.btn{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1.15rem;border:0;border-radius:18px;
  padding:.55rem 1.2rem;min-height:56px;background:var(--sol);box-shadow:0 6px 0 var(--sol2);
  transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;gap:.4rem;justify-content:center}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sol2)}
.btn.azul{background:var(--hort);color:#fff;box-shadow:0 6px 0 var(--hort2)}
.btn.azul:active{box-shadow:0 2px 0 var(--hort2)}
.btn.verde{background:var(--pasto);color:#fff;box-shadow:0 6px 0 var(--pasto2)}
.btn.verde:active{box-shadow:0 2px 0 var(--pasto2)}
.btn.branco{background:#fff;box-shadow:0 6px 0 #c9d6d8}
.btn.branco:active{box-shadow:0 2px 0 #c9d6d8}
.btn.peq{min-height:44px;font-size:.95rem;padding:.3rem .8rem;border-radius:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ouvir{background:#fff;border:3px solid var(--hort);color:var(--hort2);border-radius:999px;min-height:48px;
  padding:.2rem .9rem;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1rem}
.ouvir:active{background:#e8ebff}

.folha{background:var(--espuma);border-radius:28px;padding:1.2rem;border:5px solid var(--areia)}
.centro{text-align:center}
.linha{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.linha.c{justify-content:center}
.esp{margin-top:1rem}
.claro{color:#fff}

/* barra de topo */
.topo{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;background:var(--espuma);border-radius:22px;
  padding:.35rem .7rem;margin-bottom:.7rem;border:4px solid var(--areia)}
.topo .quem{display:flex;align-items:center;gap:.5rem;flex:1 1 220px;min-width:0}
.topo .quem svg{width:54px;height:62px;flex:none}
.topo .nome{font-family:"Baloo 2";font-weight:800;font-size:1.1rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo .niv{font-size:.8rem}
.xp{height:12px;background:#dfe9e6;border-radius:9px;overflow:hidden;width:150px;max-width:100%}
.xp i{display:block;height:100%;background:var(--pasto);border-radius:9px;transition:width .5s}
.conchas{font-family:"Baloo 2";font-weight:800;font-size:1.2rem;background:#fff;border-radius:14px;padding:.1rem .7rem;border:3px solid var(--areia)}
.ico{border:0;background:#fff;border-radius:14px;min-width:48px;min-height:48px;font-size:1.3rem;border:3px solid var(--areia)}
.ico.off{opacity:.45}

/* jogadores */
.jogadores{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.8rem;margin:1rem 0}
.jog{background:#fff;border:4px solid var(--areia);border-radius:22px;padding:.6rem;text-align:center}
.jog svg{width:90px;height:105px}
.jog b{display:block;font-family:"Baloo 2";font-size:1.15rem}
.jog small{font-size:.75rem}
input[type=text]{font:inherit;font-size:1.4rem;font-family:"Baloo 2";font-weight:800;padding:.4rem .8rem;border-radius:16px;
  border:4px solid var(--hort);width:100%;max-width:320px;text-align:center;background:#fff;color:var(--basalto)}
details{margin-top:1.2rem;font-size:.85rem}
summary{cursor:pointer;font-weight:700}
table{border-collapse:collapse;width:100%;margin:.5rem 0}
td,th{padding:.3rem .4rem;border-bottom:2px solid #e3ebe6;text-align:left}

/* avatar */
.cria{display:grid;grid-template-columns:240px 1fr;gap:1.2rem;align-items:start}
.cria .ver{background:linear-gradient(#bfe9f5 60%,#7ecbe0 60%);border-radius:24px;text-align:center;padding:.6rem;position:sticky;top:.5rem}
.cria .ver svg{width:200px;height:233px}
.opc{display:flex;flex-wrap:wrap;gap:.45rem;margin:.2rem 0 .8rem}
.op{min-width:52px;min-height:52px;border-radius:14px;border:4px solid #d8e2de;background:#fff;font-size:1.3rem;padding:0 .5rem;
  font-family:"Baloo 2";font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:.25rem}
.op.cor{width:52px}
.op.sel{border-color:var(--basalto);box-shadow:0 0 0 3px var(--sol)}
.op.fechado{opacity:.6;font-size:.9rem}
@media(max-width:640px){.cria{grid-template-columns:1fr}.cria .ver{position:static}.cria .ver svg{width:130px;height:152px}}

/* história */
.cena{display:grid;grid-template-columns:150px 1fr;gap:1rem;align-items:center}
.cena .fig{font-size:5rem;text-align:center;line-height:1}
.cena .fig svg{width:140px;height:140px}
.cena p{font-size:1.15rem}
@media(max-width:560px){.cena{grid-template-columns:1fr}.cena .fig svg{width:100px;height:100px}}

/* mapa */
.mapa{background:linear-gradient(#1C8CA8,#0F5C7A);border-radius:28px;border:5px solid var(--areia);overflow:hidden}
.mapa svg{display:block;width:100%;height:auto}
.ilha{cursor:pointer}
.ilha text{font-family:"Baloo 2",sans-serif;font-weight:800}
.ilha:focus-visible{outline:none}
.ilha:focus-visible .terra{stroke:var(--rosa);stroke-width:8}
.pulsa{animation:pulsa 1.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulsa{50%{transform:scale(1.25);opacity:.4}}
.missoes{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-top:.8rem}
.mis{background:var(--espuma);border:4px solid var(--areia);border-radius:18px;padding:.5rem .7rem;text-align:left;display:flex;gap:.5rem;align-items:center;min-height:64px}
.mis .n{font-family:"Baloo 2";font-weight:800;font-size:1.3rem;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.mis b{font-family:"Baloo 2";display:block;line-height:1.1}
.mis small{font-size:.75rem;display:block;line-height:1.2}
.mis.fech{opacity:.55}
.mis.agora{border-color:var(--sol);box-shadow:0 0 0 4px var(--sol)}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem;margin-top:.8rem}

/* jogo */
.prog{display:flex;gap:.35rem;align-items:center;flex-wrap:wrap}
.prog i{width:26px;height:14px;border-radius:8px;background:rgba(255,255,255,.3)}
.prog i.ok{background:var(--sol)} .prog i.meio{background:#ffe7a6} .prog i.at{background:#fff}
.prob{display:grid;grid-template-columns:1fr 300px;gap:1rem;align-items:start}
@media(max-width:820px){.prob{grid-template-columns:1fr}}
.enun{font-size:1.25rem;line-height:1.55}
.enun .frase{display:block;margin-bottom:.25rem}
.perg{background:#fff3c9;border-radius:16px;padding:.5rem .8rem;font-weight:700;font-size:1.2rem;margin:.6rem 0;border-left:8px solid var(--sol)}
.passo{font-family:"Baloo 2";font-weight:800;color:var(--hort2);font-size:.95rem}
.feito{background:#e3f4e4;border-radius:14px;padding:.3rem .7rem;margin:.3rem 0;font-weight:700}
.resp{display:flex;align-items:center;gap:.5rem;justify-content:center;margin:.3rem 0 .6rem;font-family:"Baloo 2";font-weight:800;font-size:1.2rem;flex-wrap:wrap}
.visor{min-width:110px;height:68px;border-radius:18px;border:5px solid var(--hort);background:#fff;font-size:2.4rem;display:grid;place-items:center;padding:0 .6rem}
.visor.mal{border-color:var(--erro);animation:abana .35s}
.visor.bem{border-color:var(--pasto);background:#e3f4e4}
@keyframes abana{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.teclas{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem}
.tecla{font-family:"Baloo 2";font-weight:800;font-size:1.7rem;min-height:60px;border-radius:16px;border:0;background:#fff;box-shadow:0 5px 0 #c9d6d8}
.tecla:active{transform:translateY(3px);box-shadow:0 2px 0 #c9d6d8}
.escolhas{display:grid;gap:.5rem}
.fala{border-radius:18px;padding:.6rem .8rem;margin:.6rem 0;font-weight:700;display:flex;gap:.6rem;align-items:center}
.fala.bem{background:#e3f4e4;border:3px solid var(--pasto)}
.fala.mal{background:#fde5e2;border:3px solid var(--erro)}
.fala.dica{background:#eef0ff;border:3px solid var(--hort);display:block}
.fala svg{width:56px;height:56px;flex:none}
.painel{background:#e9f4f6;border-radius:22px;padding:.8rem}

/* modelo de barras */
.mb{margin:.5rem 0;font-family:"Baloo 2";font-weight:800;font-size:1.15rem;text-align:center}
.mb .todo{background:var(--hort);color:#fff;border-radius:12px;padding:.25rem;margin-bottom:5px}
.mb .partes{display:flex;gap:5px}
.mb .partes span{background:var(--sol);border-radius:12px;padding:.25rem;min-width:44px}
.mb .q{background:#fff!important;color:var(--erro)!important;border:4px dashed var(--erro)}
.mb .cmp{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;align-items:center;text-align:left}
.mb .cmp .b{display:flex;gap:4px}
.mb .cmp .b span{border-radius:12px;padding:.2rem .5rem;background:var(--sol);text-align:center;min-width:44px}
.mb .cmp .b .dif{background:#ffe0ee;border:4px dashed var(--rosa)}
.mb small{font-family:"Andika";font-weight:400;font-size:.8rem;display:block;margin-top:.3rem}
.graf{display:flex;align-items:flex-end;gap:14px;height:190px;padding:10px 10px 0;border-left:4px solid var(--basalto);border-bottom:4px solid var(--basalto);margin:.5rem 0 2.2rem 1rem;max-width:340px}
.graf div{flex:1;background:var(--hort);border-radius:10px 10px 0 0;position:relative;font-family:"Baloo 2";font-weight:800;color:#fff;text-align:center;font-size:1.1rem}
.graf div em{position:absolute;bottom:-1.7rem;left:-10px;right:-10px;color:var(--basalto);font-style:normal;font-size:.85rem}

/* resultado, loja, crachás */
.estrelas{font-size:3.4rem;letter-spacing:.3rem;line-height:1}
.estrelas .off{opacity:.2;filter:grayscale(1)}
.luz{width:120px;height:120px;border-radius:50%;margin:.6rem auto;display:grid;place-items:center;font-size:3rem;animation:brilha 2s ease-in-out infinite}
@keyframes brilha{50%{box-shadow:0 0 0 18px rgba(255,200,61,.25),0 0 0 36px rgba(255,200,61,.12)}}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.7rem;margin-top:.8rem}
.item{background:#fff;border:4px solid var(--areia);border-radius:20px;padding:.6rem;text-align:center}
.item .e{font-size:2.6rem;line-height:1.1}
.item b{font-family:"Baloo 2";display:block;line-height:1.1}
.item small{font-size:.75rem;display:block;line-height:1.25;margin:.2rem 0}
.item.falta{opacity:.5}
.item.falta .e{filter:grayscale(1)}
.aviso{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--basalto);color:#fff;border-radius:18px;padding:.6rem 1.1rem;
  font-family:"Baloo 2";font-weight:800;z-index:50;max-width:92vw;text-align:center;animation:desce .3s}
@keyframes desce{from{top:-60px}}
.conf{position:fixed;top:-40px;font-size:1.8rem;z-index:40;pointer-events:none;animation:cai 1.6s ease-in forwards}
@keyframes cai{to{transform:translateY(105vh) rotate(360deg)}}

/* memória */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;max-width:520px;margin:1rem auto}
.carta{aspect-ratio:1;border-radius:18px;border:0;background:var(--hort);color:transparent;font-family:"Baloo 2";font-weight:800;font-size:1.5rem;box-shadow:0 5px 0 var(--hort2)}
.carta.v{background:#fff;color:var(--basalto);box-shadow:0 5px 0 #c9d6d8}
.carta.par{background:#e3f4e4;color:var(--pasto2);box-shadow:none}
.seq{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin:1rem 0}
.seq span{width:70px;height:70px;border-radius:18px;background:#fff;border:4px solid var(--areia);display:grid;place-items:center;font-family:"Baloo 2";font-weight:800;font-size:1.7rem}
.conta{font-family:"Baloo 2";font-weight:800;font-size:3rem;text-align:center;margin:.6rem 0}
.passo-n{display:inline-flex;align-items:center;gap:.5rem;font-family:"Baloo 2";font-weight:800;font-size:1.6rem}
.diploma{border:8px double var(--sol2);background:#fffdf2;border-radius:20px;padding:1.4rem;text-align:center}
@media(max-width:700px){.missoes{grid-template-columns:1fr 1fr}}
@media(max-width:560px){html{font-size:18px}.missoes{grid-template-columns:1fr}
 .topo{gap:.25rem;padding:.25rem .4rem;flex-wrap:nowrap}.topo .quem{flex:1 1 60px;gap:.3rem}.topo .quem svg{width:38px;height:44px}
 .topo .niv,.topo .xp{display:none}.topo .nome{font-size:.95rem}.ico{min-width:40px;min-height:40px;font-size:1.05rem}.conchas{font-size:1rem;padding:.1rem .4rem;white-space:nowrap}
 .folha{padding:.8rem;border-radius:22px}.enun{font-size:1.15rem}.tecla{min-height:52px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ============ DADOS ============ */
const NIVEIS=[[0,"Grumete"],[50,"Navegante"],[130,"Vigia do Mar"],[240,"Piloto"],[380,"Comandante"],[550,"Lenda dos Açores"]];
const PELE=["#FFDFC4","#F1C27D","#E0AC69","#C68642","#8D5524","#5C3A21"];
const CABELO=["#2B1B12","#6B3E1E","#B5651D","#E6B422","#D9482B","#8E8E93"];
const ROUPA=["#EF6FA8","#6D7FE0","#58B368","#FFC83D","#E8603C","#22A6B3"];
const PENTEADOS=["Curto","Comprido","Caracóis","Totós","Rabo de cavalo","Rapado"];
const LOJA=[
 {id:"bone",t:"chapeu",n:"Boné",e:"🧢",c:15},{id:"palha",t:"chapeu",n:"Chapéu de palha",e:"👒",c:25},
 {id:"pirata",t:"chapeu",n:"Chapéu de pirata",e:"🏴‍☠️",c:40},{id:"coroa",t:"chapeu",n:"Coroa",e:"👑",c:80},
 {id:"oculos",t:"oculos",n:"Óculos de sol",e:"🕶️",c:20},
 {id:"tartaruga",t:"amigo",n:"Tartaruga",e:"🐢",c:20},{id:"vaca",t:"amigo",n:"Vaca",e:"🐄",c:30},
 {id:"golfinho",t:"amigo",n:"Golfinho",e:"🐬",c:50},{id:"baleia",t:"amigo",n:"Baleia",e:"🐳",c:70}
];
const CRACHAS=[
 {id:"luz1",e:"💡",n:"Primeira luz",d:"Recupera a primeira luz."},
 {id:"luz3",e:"🔦",n:"Três luzes",d:"Recupera três luzes."},
 {id:"luz6",e:"🌟",n:"Seis luzes",d:"Recupera seis luzes."},
 {id:"luz9",e:"🗼",n:"Farol aceso",d:"Recupera as nove luzes."},
 {id:"tres",e:"🏅",n:"Ilha perfeita",d:"Ganha 3 estrelas numa ilha."},
 {id:"est15",e:"✨",n:"Caçador de estrelas",d:"Junta 15 estrelas."},
 {id:"est27",e:"🏆",n:"Todas as estrelas",d:"Junta as 27 estrelas."},
 {id:"cinco",e:"🔥",n:"Cinco seguidas",d:"Acerta 5 problemas seguidos à primeira."},
 {id:"raio",e:"⚡",n:"Relâmpago",d:"Acerta as 10 contas do Relâmpago."},
 {id:"memo",e:"🧠",n:"Boa memória",d:"Termina o Jogo da Memória."},
 {id:"seq",e:"🧩",n:"Detetive de números",d:"Acerta as 6 sequências."},
 {id:"autor",e:"✏️",n:"Autor de problemas",d:"Inventa e resolve um problema teu."},
 {id:"estilo",e:"🛍️",n:"Com estilo",d:"Troca conchas por um prémio."}
];
// modelos de barras: pw = parte-todo, cmp = comparação, grp = grupos iguais
const pw=(w,p,x)=>({k:"pw",w,p,x});
const cmp=(n1,v1,n2,v2,x)=>({k:"cmp",n1,v1,n2,v2,x});
const grp=(n,e,x,tip)=>({k:"grp",n,e,x,tip});
const P=(t,a,u,e,h,fig)=>({t,fig,s:[{a,u,e,h}]});

const ILHAS=[
{id:"smaria",nome:"Santa Maria",tema:"Juntar",cor:"#FFC83D",luz:"Luz Amarela",x:880,y:470,rx:42,ry:26,quem:"👩‍🌾",
 intro:"Bem-vindos a Santa Maria, a ilha do sol! A pastora Joana anda a juntar tudo o que a tempestade espalhou. Ajuda-a a contar tudo junto.",
 fim:"A pastora Joana encontrou a Luz Amarela escondida no meio do rebanho. É tua!",
 probs:[
 P("No porto estão 7 barcos azuis e 3 barcos vermelhos. Quantos barcos estão no porto ao todo?",10,"barcos","7 + 3",pw(10,[7,3],"w")),
 P("O Carlos tinha 10 carrinhos. Recebeu no seu aniversário 5 motas. Quantos brinquedos tem o Carlos, agora, ao todo?",15,"brinquedos","10 + 5",pw(15,[10,5],"w")),
 P("Num cerrado estão 10 vacas malhadas, 5 vacas pretas e 3 vacas castanhas. Quantas vacas estão no cerrado ao todo?",18,"vacas","10 + 5 + 3",pw(18,[10,5,3],"w")),
 P("Na quinta estão 12 cães barbados, 5 cães de fila e 8 cães de água. Quantos cães estão na quinta ao todo?",25,"cães","12 + 5 + 8",pw(25,[12,5,8],"w")),
 P("A Luísa apanhou 23 conchas de manhã e 14 conchas à tarde. Quantas conchas apanhou a Luísa ao todo?",37,"conchas","23 + 14",pw(37,[23,14],"w")),
 P("Num pomar há 15 macieiras, 20 pereiras e 12 laranjeiras. Quantas árvores de fruta há no pomar ao todo?",47,"árvores","15 + 20 + 12",pw(47,[15,20,12],"w")),
 P("O senhor Luís tinha 42 ovelhas. Comprou mais 15 ovelhas. Com quantas ovelhas ficou o senhor Luís?",57,"ovelhas","42 + 15",pw(57,[42,15],"w")),
 P("Numa caixa estavam 42 lápis. A Joana colocou 24 lápis na caixa. Em seguida, o José colocou 18 lápis na caixa. Quantos lápis estão agora na caixa ao todo?",84,"lápis","42 + 24 + 18",pw(84,[42,24,18],"w"))
 ]},
{id:"smiguel",nome:"São Miguel",tema:"Retirar",cor:"#58B368",luz:"Luz Verde",x:790,y:375,rx:74,ry:26,quem:"👨‍🌾",
 intro:"Em São Miguel, a ilha verde, o vento levou muita coisa. As vacas fugiram e as castanhas foram comidas! O senhor Jorge quer saber quanto ficou.",
 fim:"No fundo da Lagoa das Sete Cidades brilhava a Luz Verde. O senhor Jorge pescou-a para ti!",
 probs:[
 P("Numa tigela estavam 15 castanhas. A Joana comeu 10 castanhas. Quantas castanhas ficaram na tigela?",5,"castanhas","15 − 10",pw(15,[10,5],1)),
 P("Num cerrado estavam 27 vacas. Saíram 20 vacas. Quantas vacas ficaram no cerrado?",7,"vacas","27 − 20",pw(27,[20,7],1)),
 P("Num parque infantil estavam 19 pessoas. Saíram 7 pessoas. Quantas pessoas ficaram no parque infantil?",12,"pessoas","19 − 7",pw(19,[7,12],1)),
 P("A Patrícia tinha 16 lápis de colorir. Ela deu 4 lápis. Quantos lápis tem agora a Patrícia?",12,"lápis","16 − 4",pw(16,[4,12],1)),

    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(txt.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}🔊]/gu,"").replace(/×/g," vezes ").replace(/−/g," menos ").replace(/ : /g," a dividir por ").replace(/\?/g,"? "));
    u.lang="pt-PT";u.rate=.88;
    const vs=speechSynthesis.getVoices();
    const v=vs.find(v=>/pt[-_]PT/i.test(v.lang))||vs.find(v=>/^pt/i.test(v.lang));
    if(v)u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}

let AC=null;
function som(tipo){
  if(!D.som)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const notas={bem:[523,659,784],mal:[220,196],clique:[440],festa:[523,659,784,1047,1319]}[tipo]||[440];
    notas.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=tipo==="mal"?"triangle":"sine";o.frequency.value=f;
      const t=AC.currentTime+i*.11;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.22);
      o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.25)});
  }catch(e){}
}
function aviso(t){const d=document.createElement("div");d.className="aviso";d.setAttribute("role","status");d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}
function festa(n=14){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  for(let i=0;i<n;i++){const s=document.createElement("span");s.className="conf";s.textContent=["⭐","🐚","✨","🌟"][i%4];s.style.left=rnd(96)+"vw";s.style.animationDelay=(i*.05)+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),2400)}}

  if(humor==="pensa")s+=`<path d="M52 77 h14" stroke="#7a2e2e" stroke-width="3.5" stroke-linecap="round"/>`;

  else s+=`<path d="M49 73 Q60 83 71 73" stroke="#7a2e2e" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
  if(a.chapeu==="bone")s+=`<path d="M30 42 Q32 16 60 16 Q88 16 90 42Z" fill="#E8603C"/><path d="M84 38 Q108 36 110 46 L86 44Z" fill="#b8431f"/>`;
  if(a.chapeu==="palha")s+=`<ellipse cx="60" cy="38" rx="46" ry="9" fill="#E9C46A"/><path d="M36 38 Q38 12 60 12 Q82 12 84 38Z" fill="#F0D58C"/><path d="M37 33 h46" stroke="#EF6FA8" stroke-width="5"/>`;

/* ============ MODELO DE BARRAS ============ */
function modelo(h){
  if(!h)return"";
  const Q=`<span class="q">?</span>`;
  if(h.k==="txt")return `<p>${esc(h.t)}</p>`;
  if(h.k==="pw"){
    return `<div class="mb"><div class="todo ${h.x==="w"?"q":""}">${h.x==="w"?"?":h.w}</div><div class="partes">${h.p.map((v,i)=>`<span class="${h.x===i?"q":""}" style="flex:${Math.max(v,h.w*.14)}">${h.x===i?"?":v}</span>`).join("")}</div><small>A barra de cima é o todo. As de baixo são as partes.</small></div>`;
  }
  if(h.k==="cmp"){
    const m=h.v2,d=h.v2-h.v1,f=v=>Math.max(v/m*100,16);
    return `<div class="mb"><div class="cmp"><span>${esc(h.n1)}</span><div class="b"><span class="${h.x==="v1"?"q":""}" style="width:${f(h.v1)}%">${h.x==="v1"?"?":h.v1}</span><span class="dif ${h.x==="d"?"q":""}" style="flex:1">${h.x==="d"?"?":d}</span></div><span>${esc(h.n2)}</span><div class="b"><span class="${h.x==="v2"?"q":""}" style="width:100%">${h.x==="v2"?"?":h.v2}</span></div></div><small>A parte tracejada mostra a diferença entre os dois.</small></div>`;
  }
  if(h.k==="grp"){
    const t=h.n*h.e;let caixas="";
    if(h.x==="n")caixas=`<span>${h.e}</span><span>${h.e}</span><span style="background:none">…</span>`;
    else for(let i=0;i<h.n;i++)caixas+=`<span class="${h.x==="e"?"q":""}" style="flex:1">${h.x==="e"?"?":h.e}</span>`;
    const leg=h.x==="t"?`${h.n} grupos de ${h.e}. Quanto é ao todo?`:h.x==="e"?`${t} repartidos por ${h.n} grupos iguais. Quanto fica em cada grupo?`:`Quantos grupos de ${h.e} cabem em ${t}?`;
    return `<div class="mb">${h.tip?`<p style="font-family:Andika;font-weight:700;margin:0 0 .3rem">${esc(h.tip)}</p>`:""}<div class="todo ${h.x==="t"?"q":""}">${h.x==="t"?"?":t}</div><div class="partes">${caixas}</div><small>${leg}</small></div>`;
  }
  return"";
}

function autoLer(){if(D.lerSempre&&V.ecra==="jogo"){const p=V.probs[V.n],s=p.s[V.passo];setTimeout(()=>ler((V.passo?"":p.t+" ")+(s.q||"")),350)}}

   <div class="teclas">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="tecla" data-a="tecla" data-v="${n}">${n}</button>`).join("")}<button class="tecla" data-a="tecla" data-v="x" aria-label="Apagar">⌫</button><button class="tecla" data-a="tecla" data-v="0">0</button><button class="tecla" style="background:var(--pasto);color:#fff;box-shadow:0 5px 0 var(--pasto2)" data-a="verifica" aria-label="Verificar">✔</button></div>`;
  return `${topo()}<div class="linha" style="justify-content:space-between;margin-bottom:.5rem"><h3 class="claro">${esc(V.titulo)}</h3><div class="prog" aria-label="Problema ${V.n+1} de ${V.probs.length}">${prog}</div></div>

function responde(certo){
  const p=V.probs[V.n];

    if(V.passo===p.s.length-1){

  }

  if(V.n<V.probs.length-1){V.n++;V.passo=0;V.tent=0;V.estado="";V.txt="";V.dica=false;desenha();autoLer();return}

function conta(){const t=rnd(3);let a,b,e,r;
  if(t===0){a=2+rnd(28);b=1+rnd(20);e=`${a} + ${b}`;r=a+b}
  else if(t===1){a=8+rnd(32);b=1+rnd(Math.min(a-1,15));e=`${a} − ${b}`;r=a-b}
  else{a=[2,3,4,5,10][rnd(5)];b=1+rnd(10);e=`${b} × ${a}`;r=a*b}
  return{e,r}}
function opcoes(r){const s=new Set([r]);while(s.size<3){const v=r+[-3,-2,-1,1,2,3,10,-10][rnd(8)];if(v>=0)s.add(v)}return baralha([...s])}
function novoQuiz(tipo){
  const qs=[];const n=tipo==="raio"?10:6;
  for(let i=0;i<n;i++){
    if(tipo==="raio"){const c=conta();qs.push({e:c.e+" = ?",r:c.r,o:opcoes(c.r)})}
    else{const d=[2,5,10,3,4][rnd(5)],s=rnd(12)*(rnd(2)?1:d),pos=1+rnd(4),arr=[0,1,2,3,4].map(k=>s+k*d);qs.push({arr,pos,r:arr[pos],o:opcoes(arr[pos]),d})}
  }
  V={ecra:"quiz",tipo,qs,n:0,certas:0,est:""};desenha();
}

  carta(v){v=+v;if(V.bloq||V.viradas.includes(v)||V.pares.includes(v))return;V.viradas.push(v);som("clique");
    if(V.viradas.length===2){V.jogadas++;const [a,b]=V.viradas;

        if(V.pares.length===12){desenha();cracha("memo");setTimeout(()=>fimMini("Encontraste todos os pares!",`Precisaste de ${V.jogadas} jogadas.`,5,8),700);return}}
      else{V.bloq=true;setTimeout(()=>{if(V.ecra==="memoria"){V.viradas=[];V.bloq=false;desenha()}},1300)}}
    desenha()},
  fab(v,el){const f=V.f,k=el.dataset.k;
    if(k==="a"||k==="b"){f[k]=Math.max(1,Math.min(50,f[k]+ +v))}else f[k]=k==="op"?v:+v;

  fabOk(){const f=V.f,c=FAB.coisa[f.c],r=f.op==="+"?f.a+f.b:f.a-f.b;
    const pr={t:textoFab(f),s:[{a:r,u:c[1],e:`${f.a} ${f.op==="+"?"+":"−"} ${f.b}`,h:f.op==="+"?pw(r,[f.a,f.b],"w"):pw(f.a,[f.b,r],1)}]};
    iniciar("O meu problema",[pr],()=>{cracha("autor");fimMini("Problema resolvido!","Inventaste um problema teu. Mostra-o a um colega e vê se ele o resolve!",3,5)})}
};
